name: RepoTutor CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -e "backend[dev]"

      - name: Run backend tests
        run: python -m pytest backend

      - name: Run offline verification
        run: python scripts/verify_offline.py

      - name: Run agent evaluation
        run: python scripts/evaluate_agents.py
