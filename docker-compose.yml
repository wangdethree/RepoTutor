services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      REPO_TUTOR_DATABASE_URL: sqlite:////app/data/repotutor.db
      REPO_TUTOR_ARTIFACT_DIR: /app/artifacts
    ports:
      - "8000:8000"
    volumes:
      - repotutor-data:/app/data
      - ./artifacts:/app/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      REPO_TUTOR_API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  repotutor-data:
